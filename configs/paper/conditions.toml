# Measured conditions of the paper results (results/paper).
#
# Each entry records the runner and native settings a condition was measured
# with. `bvb run --condition <id>` turns an entry into the runner's
# own command line; it does not change any runner. Metrics for every id are in
# results/paper/conditions.csv.
#
# Runners:
#   gandalf-daytona   scripts/run_bvb_gandalf_daytona.py on the base snapshot
#   gandalf-matrix    scripts/run_bvb_gandalf_matrix.py on the derived gandalf-llm snapshot
#   rewardkit-daytona scripts/run_bvb_rewardkit_daytona.py on the derived rewardkit snapshot
#   host-matrix       scripts/run_bvb_verifier_matrix.py on evidence staged by a gandalf-daytona run
#   gandalf-batching  scripts/run_bvb_gandalf_batching.py on the derived gandalf-llm snapshot
#
# Derived snapshots are built with `python -m adapters.bvb.runtime_snapshots`.
# Host conditions without `litellm_version` used the verifier's locked runtime.

schema = "bvb-conditions/v1"

