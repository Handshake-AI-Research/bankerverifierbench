[project]
name = "bvb-reproduction"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "tomli-w",
    "pyyaml",
    "huggingface-hub",
    "openpyxl>=3.1.5",
    "daytona>=0.204.0",
    "python-dotenv>=1.0",
]

[project.scripts]
bvb = "adapters.bvb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapters"]
