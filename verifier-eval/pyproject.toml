[project]
name = "verifier-eval"
version = "0.1.0"
description = "Fail-closed BVB v1.0 verifier evaluation harness."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
verifier-eval = "verifier_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verifier_runner"]
