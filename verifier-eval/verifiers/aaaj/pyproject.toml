[project]
name = "verifier-eval-aaaj"
version = "0.1.0"
description = "uv project wrapping agent-as-a-judge for the BTB verifier-eval harness."
requires-python = ">=3.11,<3.12"
# Dependencies converted from upstream agent-as-a-judge/pyproject.toml
# (poetry → PEP 621). Version constraints are kept identical to upstream;
# the ``^X.Y`` operator means ``>=X.Y,<X+1`` per poetry semantics.
dependencies = [
    "python-dotenv>=1.0.1,<2",
    "tiktoken>=0.9.0,<1",
    "rich>=13.9.2,<14",
    "litellm>=1.50.0,<2",
    "tenacity>=9.0.0,<10",
    "numpy<2.0",
    "networkx>=3.3,<4",
    "spacy<3.8.0",
    "rank-bm25>=0.2.2,<0.3",
    "sentence-transformers>=3.1.1,<4",
    "pandas>=2.2.3,<3",
    "docx>=0.2.4,<0.3",
    "markdown>=3.7,<4",
    "python-docx>=1.1.2,<2",
    "pypdf2>=3.0.1,<4",
    "openpyxl>=3.1.5,<4",
    "opencv-python>=4.10.0.84,<5",
    "beautifulsoup4>=4.12.3,<5",
    "pylatexenc>=2.10,<3",
    "matplotlib>=3.9.2,<4",
    "tree-sitter-languages==1.8.0",
    "grep-ast>=0.3.3,<0.4",
    "rapidfuzz>=3.10.0,<4",
    "tqdm>=4.66.5,<5",
    "tree-sitter==0.21.3",
    "tf-keras>=2.17.0,<3",
    "jinja2>=3.1.3,<4",
    "python-pptx>=1.0.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_as_a_judge"]
